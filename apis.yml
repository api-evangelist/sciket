aid: sciket
name: Sciket
description: >-
  Sciket (科研市集, operated by STAREK Scientific / 勢得科研股份有限公司) is Taiwan's specialized
  online marketplace for scientific research and technology procurement. The platform
  integrates thousands of global suppliers and millions of products — laboratory
  consumables and glassware, instruments and equipment, chemical reagents and materials,
  and industrial tools and hardware — into a single digitized purchasing, sourcing, and
  fast-shipment service for research labs, academic institutions, quality-control teams,
  and manufacturers. It offers enterprise purchasing, global sourcing, PunchOut system
  integration, monthly invoicing, and laboratory-construction services. Sciket runs an
  internal storefront/API host (api.sciket.com) but does not publish a public developer
  API program, documentation, or SDKs. This profile was surfaced as a 500 Global portfolio
  company and enriched with verified identity and domain-security data.
